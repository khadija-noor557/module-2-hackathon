<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | RecipeShare</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">

<!-- NAVBAR -->
<nav class="navbar bg-white border-bottom">
    <div class="container">

        <a class="navbar-brand fw-bold d-flex align-items-center gap-2"
           href="index.html">

            <span class="brand-icon">♧</span>
            RecipeShare

        </a>

        <a href="signup.html" class="btn btn-outline-success">
            Sign Up
        </a>

    </div>
</nav>


<!-- LOGIN FORM -->
<main class="container auth-wrap">

    <section class="auth-card">

        <a href="index.html" class="auth-mark">♧</a>

        <h1>Welcome Back!</h1>

        <p class="text-secondary">
            Log in to continue sharing recipes.
        </p>

        <form id="loginBtn">

            <label for="email" class="form-label">
                Email Address
            </label>

            <input
                type="email"
                class="form-control mb-3"
                id="email"
                placeholder="you@example.com"
                required
            >

            <label for="password" class="form-label">
                Password
            </label>

            <input
                type="password"
                class="form-control mb-3"
                id="password"
                placeholder="Enter your password"
                required
            >

            <button type="button" class="btn btn-success w-100 mt-2">
                Login
            </button>

        </form>

        <p class="small mt-4 mb-0">
            Don't have an account?
            <a href="signup.html">Sign Up</a>
        </p>

        <p class="small mt-3 mb-0">
            <a href="index.html">← Back to Home</a>
        </p>

        <div class="demo-note">
            This is a UI preview. Login functionality will be added later.
        </div>

    </section>

</main>


<!-- FOOTER -->
<footer class="footer">
    <div class="container d-flex justify-content-between flex-wrap gap-2">

        <strong>♧ RecipeShare</strong>

        <span>Made for people who love sharing good food.</span>

    </div>
</footer>

<!-- supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="login.js"></script>

</body>
</html>
